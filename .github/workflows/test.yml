---
jobs:
  alpine-tests:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      -
        name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3
      -
        id: docker_build
        name: "Test actinia"
        uses: docker/build-push-action@v6
        with:
          context: "."
          file: docker/actinia-stac-tests/Dockerfile
          no-cache: true
          push: false
          tags: "actinia-core-tests:alpine"
name: "actinia-stac-plugin tests"
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# the workflow does not require permissions, but to avoid a code security warning this should be explicitly defined:
permissions: {}
